name: Publish Docker image

on:
  push:
    branches: [main, cursor/deal-radar-web-43ec]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sarlokko/cercatrova:latest
            ghcr.io/${{ github.repository_owner }}/cercatrova:latest
